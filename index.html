<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bill Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #16241F;
    --paper: #EEF0E7;
    --paper-2: #E3E6D9;
    --brass: #A9812E;
    --rust: #B04A2F;
    --sage: #7A8C7D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--ink);
    background: var(--paper);
  }
  .bl-serif { font-family: 'Source Serif 4', Georgia, serif; }
  .bl-container { max-width: 680px; margin: 0 auto; padding: 0 24px; }
  .bl-header { background: var(--ink); color: var(--paper); padding: 28px 0; }
  .bl-header h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .bl-people-row { margin-top: 8px; font-size: 13px; opacity: 0.85; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bl-person-btn { background: none; border: none; color: var(--paper); font-weight: 600; padding: 0; font-family: inherit; font-size: 13px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }
  .bl-person-input { width: 70px; background: transparent; border: none; border-bottom: 1px solid var(--brass); color: var(--paper); font-family: inherit; font-size: 13px; padding: 0; }
  .bl-tiny-icon-btn { background: none; border: 1px solid rgba(238,240,231,0.4); color: var(--paper); border-radius: 2px; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-family: inherit; font-size: 12px; line-height: 1; }
  .bl-summary { border-bottom: 2px solid var(--ink); }
  .bl-summary-row { display: flex; flex-wrap: wrap; }
  .bl-summary-cell { flex: 1 1 200px; padding: 16px 24px 16px 0; }
  .bl-summary-cell.bordered { border-right: 1px solid var(--ink); }
  .bl-summary-label { font-size: 11px; color: var(--sage); }
  .bl-summary-value { font-size: 26px; font-weight: 700; }
  .bl-row { border-bottom: 1px dashed var(--sage); padding: 16px 0; }
  .bl-row:hover { background: var(--paper-2); }
  .bl-row-inner { display: flex; align-items: flex-start; gap: 12px; }
  .bl-idx { font-size: 11px; color: var(--sage); padding-top: 4px; width: 26px; flex-shrink: 0; }
  .bl-bill-main { flex: 1; min-width: 0; }
  .bl-bill-title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bl-bill-name { font-size: 17px; font-weight: 600; }
  .bl-bill-date { font-size: 12px; color: var(--sage); }
  .bl-icon-ghost { background: none; border: none; color: var(--sage); cursor: pointer; padding: 2px; display: inline-flex; }
  .bl-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .bl-chip { border-radius: 3px; padding: 3px 8px; font-size: 11px; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: transform 0.12s ease; }
  .bl-chip:hover { transform: translateY(-1px); }
  .bl-chip.paid { border: 1px solid var(--brass); background: var(--brass); color: var(--paper); }
  .bl-chip.unpaid { border: 1px solid var(--sage); background: transparent; color: var(--ink); }
  .bl-chip.excluded { border: 1px dashed var(--sage); background: transparent; color: var(--sage); opacity: 0.55; text-decoration: line-through; }
  .bl-amount-col { text-align: right; flex-shrink: 0; }
  .bl-amount { font-size: 18px; font-weight: 700; }
  .bl-share { font-size: 11px; color: var(--sage); margin-top: 2px; }
  .bl-stamp-btn { margin-top: 10px; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 2px; background: none; letter-spacing: 1px; font-family: inherit; cursor: pointer; display: inline-block; }
  .bl-stamp-btn.paid { border: 2px solid var(--brass); color: var(--brass); transform: rotate(-5deg); }
  .bl-stamp-btn.unpaid { border: 2px solid var(--sage); color: var(--sage); }
  .bl-delete-btn { display: block; margin-top: 10px; margin-left: auto; background: none; border: none; color: var(--rust); cursor: pointer; opacity: 0.65; padding: 0; font-size: 15px; }
  .bl-input { font-family: inherit; background: var(--paper); border: 1px solid var(--sage); border-radius: 2px; padding: 6px 8px; font-size: 13px; color: var(--ink); }
  .bl-input:focus, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .bl-small-btn { background: none; border: 1px solid var(--sage); border-radius: 2px; padding: 5px 7px; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; font-family: inherit; }
  .bl-small-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .bl-custom-shares { border-top: 1px dashed var(--sage); margin-top: 10px; padding-top: 10px; }
  .bl-custom-share-row { display: flex; align-items: center; gap: 8px; }
  .bl-custom-share-row + .bl-custom-share-row { margin-top: 6px; }
  .bl-share-remaining { font-size: 11px; margin-top: 8px; }
  .bl-primary-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 2px; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .bl-ghost-btn { background: none; color: var(--sage); border: 1px solid var(--sage); border-radius: 2px; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .bl-add-toggle { width: 100%; padding: 14px; border: 1px dashed var(--sage); background: none; color: var(--sage); font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 2px; }
  .bl-add-form { border: 1px solid var(--ink); padding: 16px; border-radius: 2px; }
  .bl-add-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .bl-form-error { color: var(--rust); font-size: 12px; margin-top: 8px; }
  .bl-empty { padding: 40px 0; text-align: center; color: var(--sage); font-size: 13px; }
  .bl-status { font-size: 11px; color: var(--sage); text-align: center; padding: 10px 0 30px; }
  .bl-status.warn { color: var(--rust); }
  @media (max-width: 520px) {
    .bl-container { padding: 0 16px; }
    .bl-row-inner { flex-direction: column; }
    .bl-amount-col { text-align: left; width: 100%; margin-top: 10px; }
    .bl-delete-btn { margin-left: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div style="display:flex; align-items:center; justify-content:center; min-height:300px; color: var(--sage); font-family:'IBM Plex Mono', monospace; font-size:13px;">
    Connecting to ledger…
  </div>
</div>

<script type="module">
/* ============================================================
   SETUP — read this before using
   ============================================================
   This app stores its data in a Firebase Realtime Database so
   everyone in the household sees the same live data from their
   own phone. You need your own free Firebase project:

   1. Go to https://console.firebase.google.com and create a project.
   2. In the project, go to Build > Realtime Database > Create Database.
      Start in "test mode" (fine for a small private household app —
      just don't share the URL publicly).
   3. Go to Project settings (gear icon) > General > "Your apps" >
      click the </> (web) icon to register a web app.
   4. Copy the firebaseConfig object it gives you and paste it below,
      replacing the placeholder values.
   5. Save this file and open it — or upload it to any static host
      (Netlify Drop, GitHub Pages, Vercel) so everyone can reach it
      at a shared URL.
   ============================================================ */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCuexcR7Fc-H-H2bOR6TnVcGQU5XS_OGnY",
  authDomain: "bill-splitter-tracker.firebaseapp.com",
  databaseURL: "https://bill-splitter-tracker-default-rtdb.firebaseio.com",
  projectId: "bill-splitter-tracker",
  storageBucket: "bill-splitter-tracker.firebasestorage.app",
  messagingSenderId: "961216833885",
  appId: "1:961216833885:web:d0d284e1d8e2b88d77a0b4",
  measurementId: "G-HC2GWBNR0M"
};

const DATA_PATH = "billLedger";

const DEFAULT_STATE = {
  people: ["P1", "P2", "P3", "P4"],
  bills: [
    { id: "b1", date: "2026-08-08", name: "Internet", total: 79, vendorPaid: true, participants: [true, true, true, true], personPaid: [true, true, true, false] },
    { id: "b2", date: "2026-08-24", name: "Electricity", total: 585.33, vendorPaid: false, participants: [true, true, true, true], personPaid: [false, false, false, false] },
    { id: "b3", date: "", name: "Gas", total: 0, vendorPaid: false, participants: [true, true, true, true], personPaid: [false, false, false, false] }
  ]
};

let state = null;
let ui = {
  editingBillId: null,
  editingPersonIdx: null,
  showAddForm: false,
  formError: "",
  connected: false,
  usingFallback: false,
  // Add-bill form draft state (preserved across re-renders when toggling split mode)
  addDraft: null,
  addSplitMode: "equal",
  addShares: null,
  // Edit-bill form draft state
  editDraft: null,
  editSplitMode: null,
  editShares: null,
  editFormError: ""
};

function genId() {
  return "b-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

function fmt(n) {
  const v = isNaN(n) ? 0 : n;
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return "TBD";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("en-US", { month: "short", day: "2-digit" });
}

function shareOf(bill) {
  const count = getParticipants(bill).filter(Boolean).length;
  return count ? bill.total / count : 0;
}

function getParticipants(bill) {
  return Array.isArray(bill.participants) ? bill.participants : bill.personPaid.map(() => true);
}

function getSplitMode(bill) {
  return bill.splitMode === "custom" ? "custom" : "equal";
}

// The dollar amount a specific person owes on a bill, accounting for
// custom (uneven) splits. Returns 0 if they aren't part of the bill.
function personShare(bill, i) {
  const participants = getParticipants(bill);
  if (!participants[i]) return 0;
  if (getSplitMode(bill) === "custom" && Array.isArray(bill.shares)) {
    return Number(bill.shares[i]) || 0;
  }
  const count = participants.filter(Boolean).length;
  return count ? bill.total / count : 0;
}

// Suggests an even split of `total` across `count` people, distributing
// leftover cents so the amounts always add up exactly to the total.
function suggestEqualShares(total, count) {
  if (!count) return [];
  const cents = Math.round((Number(total) || 0) * 100);
  const base = Math.floor(cents / count);
  const remainder = cents - base * count;
  return Array.from({ length: count }, (_, i) => (base + (i < remainder ? 1 : 0)) / 100);
}

function computeTotals() {
  const totalDue = state.bills.filter((b) => !b.vendorPaid).reduce((s, b) => s + b.total, 0);
  const dueToReceive = state.bills.reduce((sum, b) => {
    const participants = getParticipants(b);
    let billSum = 0;
    participants.forEach((included, i) => {
      if (included && !b.personPaid[i]) billSum += personShare(b, i);
    });
    return sum + billSum;
  }, 0);
  return { totalDue, dueToReceive };
}

/* ---------- persistence layer ---------- */

let dbRef = null;
let fbSet = null;

async function initFirebase() {
  try {
    const looksUnconfigured = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("YOUR_") === 0;
    if (looksUnconfigured) throw new Error("Firebase not configured");

    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js");
    const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js");

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    dbRef = ref(db, DATA_PATH);
    fbSet = set;

    onValue(
      dbRef,
      (snapshot) => {
        const val = snapshot.val();
        ui.connected = true;
        ui.usingFallback = false;
        if (val && Array.isArray(val.people) && Array.isArray(val.bills)) {
          state = val;
        } else {
          state = DEFAULT_STATE;
          fbSet(dbRef, state);
        }
        render();
      },
      (err) => {
        console.error("Firebase read failed:", err);
        fallbackToLocal();
      }
    );
  } catch (e) {
    fallbackToLocal();
  }
}

function fallbackToLocal() {
  ui.connected = false;
  ui.usingFallback = true;
  try {
    const raw = localStorage.getItem("bill-ledger-data");
    state = raw ? JSON.parse(raw) : DEFAULT_STATE;
  } catch (e) {
    state = DEFAULT_STATE;
  }
  render();
}

function pushState(newState) {
  state = newState;
  if (dbRef && fbSet) {
    fbSet(dbRef, state).catch((e) => console.error("Save failed:", e));
  } else {
    try {
      localStorage.setItem("bill-ledger-data", JSON.stringify(state));
    } catch (e) {
      console.error("Local save failed:", e);
    }
  }
  render();
}

/* ---------- actions ---------- */

function addPerson() {
  if (state.people.length >= 8) return;
  pushState({
    people: [...state.people, "P" + (state.people.length + 1)],
    bills: state.bills.map((b) => ({
      ...b,
      // A newly added person isn't part of an existing custom split until
      // someone assigns them an amount; equal splits include everyone.
      participants: [...getParticipants(b), getSplitMode(b) === "custom" ? false : true],
      personPaid: [...b.personPaid, false],
      shares: [...(Array.isArray(b.shares) ? b.shares : state.people.map(() => 0)), 0]
    }))
  });
}

function removePerson() {
  if (state.people.length <= 1) return;
  pushState({
    people: state.people.slice(0, -1),
    bills: state.bills.map((b) => ({
      ...b,
      participants: getParticipants(b).slice(0, -1),
      personPaid: b.personPaid.slice(0, -1),
      shares: (Array.isArray(b.shares) ? b.shares : state.people.map(() => 0)).slice(0, -1)
    }))
  });
}

function renamePerson(idx, name) {
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  pushState({
    ...state,
    people: state.people.map((n, i) => (i === idx ? trimmed : n))
  });
}

function cyclePersonState(billId, idx) {
  pushState({
    ...state,
    bills: state.bills.map((b) => {
      if (b.id !== billId) return b;
      const participants = getParticipants(b).slice();
      const personPaid = b.personPaid.slice();
      if (getSplitMode(b) === "custom") {
        // Inclusion/amount for custom splits is set via the edit form.
        // A tap here just marks their fixed share paid or unpaid.
        if (!participants[idx]) return b;
        personPaid[idx] = !personPaid[idx];
        return { ...b, personPaid };
      }
      if (!participants[idx]) {
        // not part of this bill -> include, unpaid
        participants[idx] = true;
        personPaid[idx] = false;
      } else if (!personPaid[idx]) {
        // included, unpaid -> included, paid
        personPaid[idx] = true;
      } else {
        // included, paid -> exclude from this bill
        participants[idx] = false;
        personPaid[idx] = false;
      }
      return { ...b, participants, personPaid };
    })
  });
}

function toggleVendorPaid(billId) {
  pushState({
    ...state,
    bills: state.bills.map((b) => (b.id === billId ? { ...b, vendorPaid: !b.vendorPaid } : b))
  });
}

function deleteBill(billId) {
  pushState({ ...state, bills: state.bills.filter((b) => b.id !== billId) });
}

function addBill(date, name, totalRaw, splitMode, sharesRaw) {
  const total = parseFloat(totalRaw);
  if (!name.trim() || isNaN(total) || total < 0) {
    ui.formError = "Enter a bill name and a valid amount.";
    render();
    return;
  }

  let shares = state.people.map(() => 0);
  let participants = state.people.map(() => true);

  if (splitMode === "custom") {
    shares = state.people.map((_, i) => parseFloat(sharesRaw[i]) || 0);
    const sum = shares.reduce((a, s) => a + s, 0);
    if (Math.abs(sum - total) > 0.01) {
      ui.formError = `Custom amounts add up to ${fmt(sum)}, but the bill total is ${fmt(total)}. Adjust the amounts so they match.`;
      ui.addShares = sharesRaw;
      render();
      return;
    }
    participants = shares.map((s) => s > 0);
  }

  ui.formError = "";
  ui.showAddForm = false;
  ui.addDraft = null;
  ui.addSplitMode = "equal";
  ui.addShares = null;
  pushState({
    ...state,
    bills: [
      ...state.bills,
      {
        id: genId(),
        date,
        name: name.trim(),
        total,
        vendorPaid: false,
        splitMode: splitMode === "custom" ? "custom" : "equal",
        participants,
        personPaid: state.people.map(() => false),
        shares
      }
    ]
  });
}

function saveEdit(id, date, name, totalRaw, splitMode, sharesRaw) {
  const bill = state.bills.find((b) => b.id === id);
  if (!bill) return;
  const total = parseFloat(totalRaw);
  const finalTotal = isNaN(total) ? bill.total : total;

  let shares = Array.isArray(bill.shares) ? bill.shares : state.people.map(() => 0);
  let participants = getParticipants(bill);

  if (splitMode === "custom") {
    shares = state.people.map((_, i) => parseFloat(sharesRaw[i]) || 0);
    const sum = shares.reduce((a, s) => a + s, 0);
    if (Math.abs(sum - finalTotal) > 0.01) {
      ui.editFormError = `Custom amounts add up to ${fmt(sum)}, but the bill total is ${fmt(finalTotal)}. Adjust the amounts so they match.`;
      ui.editShares = sharesRaw;
      ui.editSplitMode = "custom";
      render();
      return;
    }
    participants = shares.map((s) => s > 0);
  }

  pushState({
    ...state,
    bills: state.bills.map((b) =>
      b.id === id
        ? {
            ...b,
            date,
            name: name.trim() || b.name,
            total: finalTotal,
            splitMode: splitMode === "custom" ? "custom" : "equal",
            participants,
            shares
          }
        : b
    )
  });
  ui.editingBillId = null;
  ui.editDraft = null;
  ui.editSplitMode = null;
  ui.editShares = null;
  ui.editFormError = "";
}

/* ---------- rendering ---------- */

function render() {
  const root = document.getElementById("app");
  if (!state) return;
  const { totalDue, dueToReceive } = computeTotals();

  root.innerHTML = `
    <div class="bl-header">
      <div class="bl-container">
        <h1 class="bl-serif">Bill Ledger</h1>
        <div class="bl-people-row">
          <span>Split between</span>
          ${state.people.map((p, i) => renderPersonChip(p, i)).join('<span style="opacity:0.5">·</span>')}
          <button class="bl-tiny-icon-btn" data-action="add-person" title="Add person">+</button>
          ${state.people.length > 1 ? '<button class="bl-tiny-icon-btn" data-action="remove-person" title="Remove last person">&times;</button>' : ""}
        </div>
      </div>
    </div>

    <div class="bl-summary">
      <div class="bl-container bl-summary-row">
        <div class="bl-summary-cell bordered">
          <div class="bl-summary-label">Total Due</div>
          <div class="bl-serif bl-summary-value" style="color:${totalDue > 0 ? "var(--rust)" : "var(--ink)"}">${fmt(totalDue)}</div>
        </div>
        <div class="bl-summary-cell">
          <div class="bl-summary-label">Due to Receive</div>
          <div class="bl-serif bl-summary-value" style="color:${dueToReceive > 0 ? "var(--brass)" : "var(--ink)"}">${fmt(dueToReceive)}</div>
        </div>
      </div>
    </div>

    <div class="bl-container" style="padding-top:8px; padding-bottom:8px;">
      ${state.bills.length === 0 ? '<div class="bl-empty">No bills yet — add your first one below.</div>' : state.bills.map((b, idx) => renderBillRow(b, idx)).join("")}
    </div>

    <div class="bl-container" style="padding-bottom:16px; padding-top:8px;">
      ${ui.showAddForm ? renderAddForm() : '<button class="bl-add-toggle" data-action="show-add-form">+ Add a bill</button>'}
    </div>

    <div class="bl-status ${ui.usingFallback ? "warn" : ""}">
      ${ui.usingFallback ? "Not connected to a shared ledger — saving to this device only. Add your Firebase config in the file to sync across phones." : "Synced live across everyone with this link."}
    </div>
  `;

  attachHandlers();
}

function renderPersonChip(p, i) {
  if (ui.editingPersonIdx === i) {
    return `<span><input class="bl-person-input" id="person-input-${i}" value="${escapeAttr(p)}" data-idx="${i}" /></span>`;
  }
  return `<span><button class="bl-person-btn" data-action="start-rename-person" data-idx="${i}">${escapeHtml(p)}</button></span>`;
}

function renderBillRow(b, idx) {
  const share = shareOf(b);
  const mode = getSplitMode(b);
  const participants = getParticipants(b);
  const participantCount = participants.filter(Boolean).length;
  if (ui.editingBillId === b.id) {
    const draft = ui.editDraft || { date: b.date, name: b.name, total: String(b.total) };
    const mode = ui.editSplitMode || getSplitMode(b);
    const shares =
      ui.editShares ||
      (getSplitMode(b) === "custom" && Array.isArray(b.shares)
        ? b.shares.map(String)
        : suggestEqualShares(parseFloat(draft.total) || b.total, state.people.length).map(String));
    return `
      <div class="bl-row">
        <div class="bl-row-inner">
          <div class="bl-idx">${String(idx + 1).padStart(3, "0")}</div>
          <div class="bl-bill-main">
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <input type="date" class="bl-input" id="edit-date-${b.id}" value="${escapeAttr(draft.date)}" />
              <input type="text" class="bl-input" id="edit-name-${b.id}" value="${escapeAttr(draft.name)}" style="flex:1; min-width:120px;" placeholder="Bill name" />
              <input type="number" step="0.01" class="bl-input" id="edit-total-${b.id}" value="${escapeAttr(draft.total)}" style="width:90px;" placeholder="0.00" />
            </div>
            <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <span style="font-size:12px; color:var(--sage);">Split</span>
              <button type="button" class="bl-small-btn ${mode === "equal" ? "active" : ""}" data-action="set-edit-split-mode" data-bill-id="${b.id}" data-mode="equal">Equal</button>
              <button type="button" class="bl-small-btn ${mode === "custom" ? "active" : ""}" data-action="set-edit-split-mode" data-bill-id="${b.id}" data-mode="custom">Custom amounts</button>
            </div>
            ${mode === "custom" ? renderCustomShareInputs(`edit-share-${b.id}`, state.people, shares) : ""}
            ${ui.editFormError ? `<div class="bl-form-error">${escapeHtml(ui.editFormError)}</div>` : ""}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button class="bl-small-btn" data-action="save-edit" data-bill-id="${b.id}">✓ Save</button>
              <button class="bl-small-btn" data-action="cancel-edit">&times; Cancel</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="bl-row">
      <div class="bl-row-inner">
        <div class="bl-idx">${String(idx + 1).padStart(3, "0")}</div>
        <div class="bl-bill-main">
          <div class="bl-bill-title-row">
            <span class="bl-serif bl-bill-name">${escapeHtml(b.name)}</span>
            <span class="bl-bill-date">${fmtDate(b.date)}</span>
            <button class="bl-icon-ghost" data-action="start-edit" data-bill-id="${b.id}" title="Edit bill">✎</button>
          </div>
          <div class="bl-chips">
            ${state.people
              .map((p, i) => {
                const included = participants[i];
                const paid = b.personPaid[i];
                const cls = !included ? "excluded" : paid ? "paid" : "unpaid";
                const label = !included ? "− " : paid ? "✓ " : "";
                const amountLabel = mode === "custom" && included ? ` ${fmt(personShare(b, i))}` : "";
                let title;
                if (!included) {
                  title = mode === "custom" ? `${p} is not part of this bill — edit the bill to give them a share` : `${p} is not part of this bill — click to include`;
                } else if (mode === "custom") {
                  title = `${p} owes ${fmt(personShare(b, i))} and has ${paid ? "paid" : "not paid"} — click to mark ${paid ? "unpaid" : "paid"}`;
                } else {
                  title = `${p} has ${paid ? "paid" : "not paid"} their share — click to ${paid ? "leave out of this bill" : "mark paid"}`;
                }
                return `
              <button class="bl-chip ${cls}" data-action="toggle-person" data-bill-id="${b.id}" data-person-idx="${i}" title="${escapeAttr(title)}">
                ${label}${escapeHtml(p)}${amountLabel}
              </button>`;
              })
              .join("")}
          </div>
        </div>
        <div class="bl-amount-col">
          <div class="bl-serif bl-amount">${fmt(b.total)}</div>
          <div class="bl-share">${
            mode === "custom"
              ? `custom split · ${participantCount} of ${state.people.length}`
              : `${fmt(share)} / person${participantCount !== state.people.length ? ` · ${participantCount} of ${state.people.length}` : ""}`
          }</div>
          <button class="bl-stamp-btn ${b.vendorPaid ? "paid" : "unpaid"}" data-action="toggle-vendor" data-bill-id="${b.id}">${b.vendorPaid ? "PAID" : "UNPAID"}</button>
          <button class="bl-delete-btn" data-action="delete-bill" data-bill-id="${b.id}" title="Delete bill">🗑</button>
        </div>
      </div>
    </div>
  `;
}

function renderAddForm() {
  const draft = ui.addDraft || { date: "", name: "", total: "" };
  const mode = ui.addSplitMode || "equal";
  const shares = ui.addShares || suggestEqualShares(parseFloat(draft.total) || 0, state.people.length).map(String);
  return `
    <form class="bl-add-form" id="add-bill-form">
      <div class="bl-add-form-row">
        <input type="date" class="bl-input" id="new-bill-date" value="${escapeAttr(draft.date)}" />
        <input type="text" class="bl-input" id="new-bill-name" placeholder="Bill name" style="flex:1; min-width:140px;" value="${escapeAttr(draft.name)}" required />
        <input type="number" step="0.01" min="0" class="bl-input" id="new-bill-total" placeholder="0.00" style="width:100px;" value="${escapeAttr(draft.total)}" required />
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <span style="font-size:12px; color:var(--sage);">Split</span>
        <button type="button" class="bl-small-btn ${mode === "equal" ? "active" : ""}" data-action="set-add-split-mode" data-mode="equal">Equal</button>
        <button type="button" class="bl-small-btn ${mode === "custom" ? "active" : ""}" data-action="set-add-split-mode" data-mode="custom">Custom amounts</button>
      </div>
      ${mode === "custom" ? renderCustomShareInputs("new-share", state.people, shares) : ""}
      ${ui.formError ? `<div class="bl-form-error">${escapeHtml(ui.formError)}</div>` : ""}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="submit" class="bl-primary-btn">Add bill</button>
        <button type="button" class="bl-ghost-btn" data-action="cancel-add-form">Cancel</button>
      </div>
    </form>
  `;
}

// Renders one number input per person for a custom split, plus a live
// "assigned so far" readout. `prefix` must be unique per form instance
// (e.g. "new-share" or "edit-share-<billId>") since input ids use it.
function renderCustomShareInputs(prefix, people, shares) {
  return `
    <div class="bl-custom-shares" id="${prefix}-wrap">
      ${people
        .map(
          (p, i) => `
        <div class="bl-custom-share-row">
          <span style="font-size:13px; flex:1;">${escapeHtml(p)}</span>
          <input type="number" step="0.01" min="0" class="bl-input" style="width:90px;" id="${prefix}-${i}" data-share-idx="${i}" value="${escapeAttr(shares[i] ?? "")}" placeholder="0.00" />
        </div>`
        )
        .join("")}
      <div class="bl-share-remaining" id="${prefix}-remaining"></div>
    </div>
  `;
}

// Wires up live "assigned so far / remaining" feedback for a set of custom
// share inputs, without triggering a full re-render on every keystroke
// (which would otherwise steal focus from the field being edited).
function wireShareInputs(prefix, totalInputId) {
  const wrap = document.getElementById(`${prefix}-wrap`);
  const totalEl = document.getElementById(totalInputId);
  const remainingEl = document.getElementById(`${prefix}-remaining`);
  if (!wrap || !remainingEl) return;

  const update = () => {
    const total = parseFloat(totalEl?.value) || 0;
    let sum = 0;
    wrap.querySelectorAll("input[data-share-idx]").forEach((inp) => {
      sum += parseFloat(inp.value) || 0;
    });
    const remaining = Math.round((total - sum) * 100) / 100;
    if (Math.abs(remaining) < 0.005) {
      remainingEl.textContent = `Assigned ${fmt(sum)} of ${fmt(total)} — balanced ✓`;
      remainingEl.style.color = "var(--sage)";
    } else if (remaining > 0) {
      remainingEl.textContent = `Assigned ${fmt(sum)} of ${fmt(total)} — ${fmt(remaining)} left to assign`;
      remainingEl.style.color = "var(--rust)";
    } else {
      remainingEl.textContent = `Assigned ${fmt(sum)} of ${fmt(total)} — ${fmt(Math.abs(remaining))} over the total`;
      remainingEl.style.color = "var(--rust)";
    }
  };

  wrap.querySelectorAll("input[data-share-idx]").forEach((inp) => inp.addEventListener("input", update));
  if (totalEl) totalEl.addEventListener("input", update);
  update();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- event wiring ---------- */

function attachHandlers() {
  const root = document.getElementById("app");

  root.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", (e) => {
      const action = el.getAttribute("data-action");
      const billId = el.getAttribute("data-bill-id");
      const idx = el.getAttribute("data-idx");
      const personIdx = el.getAttribute("data-person-idx");

      if (action === "add-person") addPerson();
      else if (action === "remove-person") removePerson();
      else if (action === "start-rename-person") {
        ui.editingPersonIdx = Number(idx);
        render();
        const input = document.getElementById("person-input-" + idx);
        if (input) {
          input.focus();
          input.select();
        }
      } else if (action === "toggle-person") cyclePersonState(billId, Number(personIdx));
      else if (action === "toggle-vendor") toggleVendorPaid(billId);
      else if (action === "delete-bill") {
        if (confirm("Delete this bill?")) deleteBill(billId);
      } else if (action === "start-edit") {
        const bill = state.bills.find((x) => x.id === billId);
        ui.editingBillId = billId;
        ui.editDraft = { date: bill.date, name: bill.name, total: String(bill.total) };
        ui.editSplitMode = getSplitMode(bill);
        ui.editShares = getSplitMode(bill) === "custom" && Array.isArray(bill.shares) ? bill.shares.map(String) : null;
        ui.editFormError = "";
        render();
      } else if (action === "cancel-edit") {
        ui.editingBillId = null;
        ui.editDraft = null;
        ui.editSplitMode = null;
        ui.editShares = null;
        ui.editFormError = "";
        render();
      } else if (action === "save-edit") {
        const date = document.getElementById("edit-date-" + billId).value;
        const name = document.getElementById("edit-name-" + billId).value;
        const total = document.getElementById("edit-total-" + billId).value;
        const mode = ui.editSplitMode || getSplitMode(state.bills.find((x) => x.id === billId));
        const sharesRaw = mode === "custom" ? state.people.map((_, i) => document.getElementById(`edit-share-${billId}-${i}`)?.value || "0") : null;
        saveEdit(billId, date, name, total, mode, sharesRaw);
      } else if (action === "set-edit-split-mode") {
        const mode = el.getAttribute("data-mode");
        ui.editDraft = {
          date: document.getElementById("edit-date-" + billId)?.value || "",
          name: document.getElementById("edit-name-" + billId)?.value || "",
          total: document.getElementById("edit-total-" + billId)?.value || ""
        };
        if (mode === "custom") {
          const bill = state.bills.find((x) => x.id === billId);
          const existing = state.people.map((_, i) => document.getElementById(`edit-share-${billId}-${i}`)?.value);
          if (existing.some((v) => v)) {
            ui.editShares = existing;
          } else if (bill && getSplitMode(bill) === "custom" && Array.isArray(bill.shares)) {
            ui.editShares = bill.shares.map(String);
          } else {
            const totalVal = parseFloat(ui.editDraft.total) || (bill ? bill.total : 0);
            ui.editShares = suggestEqualShares(totalVal, state.people.length).map(String);
          }
        } else {
          ui.editShares = null;
        }
        ui.editSplitMode = mode;
        ui.editFormError = "";
        render();
      } else if (action === "show-add-form") {
        ui.showAddForm = true;
        ui.formError = "";
        ui.addDraft = { date: "", name: "", total: "" };
        ui.addSplitMode = "equal";
        ui.addShares = null;
        render();
      } else if (action === "cancel-add-form") {
        ui.showAddForm = false;
        ui.formError = "";
        ui.addDraft = null;
        ui.addSplitMode = "equal";
        ui.addShares = null;
        render();
      } else if (action === "set-add-split-mode") {
        const mode = el.getAttribute("data-mode");
        ui.addDraft = {
          date: document.getElementById("new-bill-date")?.value || "",
          name: document.getElementById("new-bill-name")?.value || "",
          total: document.getElementById("new-bill-total")?.value || ""
        };
        if (mode === "custom") {
          const existing = state.people.map((_, i) => document.getElementById("new-share-" + i)?.value);
          ui.addShares = existing.some((v) => v) ? existing : suggestEqualShares(parseFloat(ui.addDraft.total) || 0, state.people.length).map(String);
        } else {
          ui.addShares = null;
        }
        ui.addSplitMode = mode;
        ui.formError = "";
        render();
      }
    });
  });

  state.people.forEach((p, i) => {
    if (ui.editingPersonIdx === i) {
      const input = document.getElementById("person-input-" + i);
      if (!input) return;
      const commit = () => {
        renamePerson(i, input.value);
        ui.editingPersonIdx = null;
      };
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          commit();
        }
        if (e.key === "Escape") {
          ui.editingPersonIdx = null;
          render();
        }
      });
    }
  });

  const addForm = document.getElementById("add-bill-form");
  if (addForm) {
    addForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const date = document.getElementById("new-bill-date").value;
      const name = document.getElementById("new-bill-name").value;
      const total = document.getElementById("new-bill-total").value;
      const mode = ui.addSplitMode || "equal";
      const sharesRaw = mode === "custom" ? state.people.map((_, i) => document.getElementById("new-share-" + i)?.value || "0") : null;
      addBill(date, name, total, mode, sharesRaw);
    });
  }

  if (ui.showAddForm && ui.addSplitMode === "custom") {
    wireShareInputs("new-share", "new-bill-total");
  }
  if (ui.editingBillId && (ui.editSplitMode || getSplitMode(state.bills.find((b) => b.id === ui.editingBillId) || {})) === "custom") {
    wireShareInputs(`edit-share-${ui.editingBillId}`, `edit-total-${ui.editingBillId}`);
  }
}

initFirebase();
</script>
</body>
</html>
