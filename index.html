<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bill Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #16241F;
    --paper: #EEF0E7;
    --paper-2: #E3E6D9;
    --brass: #A9812E;
    --rust: #B04A2F;
    --sage: #7A8C7D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--ink);
    background: var(--paper);
  }
  .bl-serif { font-family: 'Source Serif 4', Georgia, serif; }
  .bl-container { max-width: 680px; margin: 0 auto; padding: 0 24px; }
  .bl-header { background: var(--ink); color: var(--paper); padding: 28px 0; }
  .bl-header h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .bl-people-row { margin-top: 8px; font-size: 13px; opacity: 0.85; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bl-person-btn { background: none; border: none; color: var(--paper); font-weight: 600; padding: 0; font-family: inherit; font-size: 13px; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; }
  .bl-person-input { width: 70px; background: transparent; border: none; border-bottom: 1px solid var(--brass); color: var(--paper); font-family: inherit; font-size: 13px; padding: 0; }
  .bl-tiny-icon-btn { background: none; border: 1px solid rgba(238,240,231,0.4); color: var(--paper); border-radius: 2px; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; font-family: inherit; font-size: 12px; line-height: 1; }
  .bl-summary { border-bottom: 2px solid var(--ink); }
  .bl-summary-row { display: flex; flex-wrap: wrap; }
  .bl-summary-cell { flex: 1 1 200px; padding: 16px 24px 16px 0; }
  .bl-summary-cell.bordered { border-right: 1px solid var(--ink); }
  .bl-summary-label { font-size: 11px; color: var(--sage); }
  .bl-summary-value { font-size: 26px; font-weight: 700; }
  .bl-row { border-bottom: 1px dashed var(--sage); padding: 16px 0; }
  .bl-row:hover { background: var(--paper-2); }
  .bl-row-inner { display: flex; align-items: flex-start; gap: 12px; }
  .bl-idx { font-size: 11px; color: var(--sage); padding-top: 4px; width: 26px; flex-shrink: 0; }
  .bl-bill-main { flex: 1; min-width: 0; }
  .bl-bill-title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bl-bill-name { font-size: 17px; font-weight: 600; }
  .bl-bill-date { font-size: 12px; color: var(--sage); }
  .bl-icon-ghost { background: none; border: none; color: var(--sage); cursor: pointer; padding: 2px; display: inline-flex; }
  .bl-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .bl-chip { border-radius: 3px; padding: 3px 8px; font-size: 11px; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; transition: transform 0.12s ease; }
  .bl-chip:hover { transform: translateY(-1px); }
  .bl-chip.paid { border: 1px solid var(--brass); background: var(--brass); color: var(--paper); }
  .bl-chip.unpaid { border: 1px solid var(--sage); background: transparent; color: var(--ink); }
  .bl-chip.excluded { border: 1px dashed var(--sage); background: transparent; color: var(--sage); opacity: 0.55; text-decoration: line-through; }
  .bl-chip .bl-chip-amt { font-weight: 600; }
  .bl-chip .bl-chip-star { font-weight: 700; }
  .bl-amount-col { text-align: right; flex-shrink: 0; }
  .bl-amount { font-size: 18px; font-weight: 700; }
  .bl-share { font-size: 11px; color: var(--sage); margin-top: 2px; }
  .bl-share.warn { color: var(--rust); }
  .bl-stamp-btn { margin-top: 10px; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 2px; background: none; letter-spacing: 1px; font-family: inherit; cursor: pointer; display: inline-block; }
  .bl-stamp-btn.paid { border: 2px solid var(--brass); color: var(--brass); transform: rotate(-5deg); }
  .bl-stamp-btn.unpaid { border: 2px solid var(--sage); color: var(--sage); }
  .bl-delete-btn { display: block; margin-top: 10px; margin-left: auto; background: none; border: none; color: var(--rust); cursor: pointer; opacity: 0.65; padding: 0; font-size: 15px; }
  .bl-input { font-family: inherit; background: var(--paper); border: 1px solid var(--sage); border-radius: 2px; padding: 6px 8px; font-size: 13px; color: var(--ink); }
  .bl-input:focus, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .bl-small-btn { background: none; border: 1px solid var(--sage); border-radius: 2px; padding: 5px 7px; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; font-family: inherit; }
  .bl-primary-btn { background: var(--ink); color: var(--paper); border: none; border-radius: 2px; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .bl-ghost-btn { background: none; color: var(--sage); border: 1px solid var(--sage); border-radius: 2px; padding: 8px 16px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .bl-add-toggle { width: 100%; padding: 14px; border: 1px dashed var(--sage); background: none; color: var(--sage); font-family: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 2px; }
  .bl-add-form { border: 1px solid var(--ink); padding: 16px; border-radius: 2px; }
  .bl-add-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .bl-form-error { color: var(--rust); font-size: 12px; margin-top: 8px; }
  .bl-empty { padding: 40px 0; text-align: center; color: var(--sage); font-size: 13px; }
  .bl-status { font-size: 11px; color: var(--sage); text-align: center; padding: 10px 0 30px; }
  .bl-status.warn { color: var(--rust); }

  /* split editor */
  .bl-split-editor { margin-top: 14px; border-top: 1px dashed var(--sage); padding-top: 12px; }
  .bl-mode-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .bl-mode-btn { flex: 1; padding: 7px 8px; border: 1px solid var(--sage); background: none; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--ink); border-radius: 2px; }
  .bl-mode-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .bl-person-line { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dotted var(--paper-2); }
  .bl-person-line label { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; cursor: pointer; font-size: 13px; }
  .bl-person-line input[type="checkbox"] { accent-color: var(--brass); width: 15px; height: 15px; flex-shrink: 0; }
  .bl-person-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bl-amt-input { width: 78px; flex-shrink: 0; }
  .bl-person-owe { font-size: 12px; color: var(--sage); min-width: 62px; text-align: right; flex-shrink: 0; }
  .bl-preview { margin-top: 12px; font-size: 12px; color: var(--sage); line-height: 1.5; }
  .bl-preview.warn { color: var(--rust); }
  .bl-editor-hint { font-size: 11px; color: var(--sage); margin-bottom: 8px; }

  @media (max-width: 520px) {
    .bl-container { padding: 0 16px; }
    .bl-row-inner { flex-direction: column; }
    .bl-amount-col { text-align: left; width: 100%; margin-top: 10px; }
    .bl-delete-btn { margin-left: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div style="display:flex; align-items:center; justify-content:center; min-height:300px; color: var(--sage); font-family:'IBM Plex Mono', monospace; font-size:13px;">
    Connecting to ledger…
  </div>
</div>

<script type="module">
/* ============================================================
   SETUP — read this before using
   ============================================================
   This app stores its data in a Firebase Realtime Database so
   everyone in the household sees the same live data from their
   own phone. You need your own free Firebase project:

   1. Go to https://console.firebase.google.com and create a project.
   2. In the project, go to Build > Realtime Database > Create Database.
      Start in "test mode" (fine for a small private household app —
      just don't share the URL publicly).
   3. Go to Project settings (gear icon) > General > "Your apps" >
      click the </> (web) icon to register a web app.
   4. Copy the firebaseConfig object it gives you and paste it below,
      replacing the placeholder values.
   5. Save this file and open it — or upload it to any static host
      (Netlify Drop, GitHub Pages, Vercel) so everyone can reach it
      at a shared URL.
   ============================================================ */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCuexcR7Fc-H-H2bOR6TnVcGQU5XS_OGnY",
  authDomain: "bill-splitter-tracker.firebaseapp.com",
  databaseURL: "https://bill-splitter-tracker-default-rtdb.firebaseio.com",
  projectId: "bill-splitter-tracker",
  storageBucket: "bill-splitter-tracker.firebasestorage.app",
  messagingSenderId: "961216833885",
  appId: "1:961216833885:web:d0d284e1d8e2b88d77a0b4",
  measurementId: "G-HC2GWBNR0M"
};

const DATA_PATH = "billLedger";

const DEFAULT_STATE = {
  people: ["P1", "P2", "P3", "P4"],
  bills: [
    { id: "b1", date: "2026-08-08", name: "Internet", total: 79, vendorPaid: true, participants: [true, true, true, true], personPaid: [true, true, true, false], custom: [null, null, null, null] },
    { id: "b2", date: "2026-08-24", name: "Electricity", total: 585.33, vendorPaid: false, participants: [true, true, true, true], personPaid: [false, false, false, false], custom: [null, null, null, null] },
    { id: "b3", date: "", name: "Gas", total: 0, vendorPaid: false, participants: [true, true, true, true], personPaid: [false, false, false, false], custom: [null, null, null, null] }
  ]
};

let state = null;
let ui = { draft: null, editingPersonIdx: null, formError: "", connected: false, usingFallback: false };

function genId() {
  return "b-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
}

function fmt(n) {
  const v = isNaN(n) ? 0 : n;
  return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return "TBD";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString("en-US", { month: "short", day: "2-digit" });
}

function getParticipants(bill) {
  return Array.isArray(bill.participants) ? bill.participants : bill.personPaid.map(() => true);
}

/* Normalizes a bill's per-person custom amounts to the new model:
   an array where each entry is either a fixed dollar amount that
   person pays, or null meaning "split the remainder evenly".
   - New format: bill.custom already holds that array.
   - Old master format: bill.splitMode === "custom" + bill.shares
     (absolute per-person amounts) is converted into custom amounts.
   - Everything else (plain even split) becomes all-null. */
function getCustom(bill) {
  if (Array.isArray(bill.custom)) {
    return bill.custom.map((c) => (typeof c === "number" && !isNaN(c) ? c : null));
  }
  if (bill.splitMode === "custom" && Array.isArray(bill.shares)) {
    const participants = getParticipants(bill);
    return bill.shares.map((s, i) => (participants[i] && typeof s === "number" ? s : null));
  }
  return (bill.personPaid || []).map(() => null);
}

/* Given a bill, work out how much each person owes. People with a
   custom amount pay exactly that; everyone else included splits the
   remainder of the bill evenly among themselves. */
function computeShares(bill) {
  const participants = getParticipants(bill);
  const custom = getCustom(bill);
  const n = participants.length;
  const amounts = new Array(n).fill(0);
  let customSum = 0;
  const splitIdx = [];
  for (let i = 0; i < n; i++) {
    if (!participants[i]) continue;
    const c = custom[i];
    if (typeof c === "number" && !isNaN(c)) {
      amounts[i] = c;
      customSum += c;
    } else {
      splitIdx.push(i);
    }
  }
  const remainder = (Number(bill.total) || 0) - customSum;
  const per = splitIdx.length ? remainder / splitIdx.length : 0;
  splitIdx.forEach((i) => (amounts[i] = per));
  const customCount = participants.filter((p, i) => p && typeof custom[i] === "number").length;
  const over = remainder < -0.005;
  const mismatch = splitIdx.length === 0 && Math.abs(remainder) > 0.005;
  return { amounts, per, splitCount: splitIdx.length, customCount, customSum, remainder, over, mismatch };
}

function computeTotals() {
  const totalDue = state.bills.filter((b) => !b.vendorPaid).reduce((s, b) => s + (Number(b.total) || 0), 0);
  const dueToReceive = state.bills.reduce((sum, b) => {
    const { amounts } = computeShares(b);
    const participants = getParticipants(b);
    let s = 0;
    participants.forEach((inc, i) => {
      if (inc && !b.personPaid[i]) s += amounts[i];
    });
    return sum + s;
  }, 0);
  return { totalDue, dueToReceive };
}

/* ---------- draft (add / edit editor) helpers ---------- */

function newAddDraft() {
  return {
    billId: null,
    date: "",
    name: "",
    total: "",
    mode: "auto",
    include: state.people.map(() => true),
    amounts: state.people.map(() => "")
  };
}

function billToDraft(b) {
  const participants = getParticipants(b);
  const custom = getCustom(b);
  const hasCustom = custom.some((c, i) => participants[i] && typeof c === "number");
  return {
    billId: b.id,
    date: b.date || "",
    name: b.name || "",
    total: String(b.total),
    mode: hasCustom ? "custom" : "auto",
    include: participants.slice(),
    amounts: custom.map((c) => (typeof c === "number" ? String(c) : ""))
  };
}

/* Compute the live breakdown from an in-progress draft. */
function draftToShares(d) {
  const total = parseFloat(d.total);
  const t = isNaN(total) ? 0 : total;
  const n = d.include.length;
  const amounts = new Array(n).fill(0);
  let customSum = 0;
  const splitIdx = [];
  for (let i = 0; i < n; i++) {
    if (!d.include[i]) continue;
    if (d.mode === "custom") {
      const raw = d.amounts[i];
      const v = parseFloat(raw);
      if (raw !== "" && raw != null && !isNaN(v)) {
        amounts[i] = v;
        customSum += v;
        continue;
      }
    }
    splitIdx.push(i);
  }
  const remainder = t - customSum;
  const per = splitIdx.length ? remainder / splitIdx.length : 0;
  splitIdx.forEach((i) => (amounts[i] = per));
  const over = remainder < -0.005;
  const mismatch = splitIdx.length === 0 && Math.abs(remainder) > 0.005;
  return { amounts, per, splitCount: splitIdx.length, customSum, remainder, over, mismatch, total: t };
}

/* ---------- persistence layer ---------- */

let dbRef = null;
let fbSet = null;

async function initFirebase() {
  try {
    const looksUnconfigured = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("YOUR_") === 0;
    if (looksUnconfigured) throw new Error("Firebase not configured");

    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js");
    const { getDatabase, ref, onValue, set } = await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js");

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    dbRef = ref(db, DATA_PATH);
    fbSet = set;

    onValue(
      dbRef,
      (snapshot) => {
        const val = snapshot.val();
        ui.connected = true;
        ui.usingFallback = false;
        if (val && Array.isArray(val.people) && Array.isArray(val.bills)) {
          state = val;
        } else {
          state = DEFAULT_STATE;
          fbSet(dbRef, state);
        }
        render();
      },
      (err) => {
        console.error("Firebase read failed:", err);
        fallbackToLocal();
      }
    );
  } catch (e) {
    fallbackToLocal();
  }
}

function fallbackToLocal() {
  ui.connected = false;
  ui.usingFallback = true;
  try {
    const raw = localStorage.getItem("bill-ledger-data");
    state = raw ? JSON.parse(raw) : DEFAULT_STATE;
  } catch (e) {
    state = DEFAULT_STATE;
  }
  render();
}

function pushState(newState) {
  state = newState;
  if (dbRef && fbSet) {
    fbSet(dbRef, state).catch((e) => console.error("Save failed:", e));
  } else {
    try {
      localStorage.setItem("bill-ledger-data", JSON.stringify(state));
    } catch (e) {
      console.error("Local save failed:", e);
    }
  }
  render();
}

/* ---------- actions ---------- */

function addPerson() {
  if (state.people.length >= 8) return;
  pushState({
    people: [...state.people, "P" + (state.people.length + 1)],
    bills: state.bills.map((b) => ({
      ...b,
      participants: [...getParticipants(b), true],
      personPaid: [...b.personPaid, false],
      custom: [...getCustom(b), null]
    }))
  });
}

function removePerson() {
  if (state.people.length <= 1) return;
  pushState({
    people: state.people.slice(0, -1),
    bills: state.bills.map((b) => ({
      ...b,
      participants: getParticipants(b).slice(0, -1),
      personPaid: b.personPaid.slice(0, -1),
      custom: getCustom(b).slice(0, -1)
    }))
  });
}

function renamePerson(idx, name) {
  const trimmed = (name || "").trim();
  if (!trimmed) return;
  pushState({
    ...state,
    people: state.people.map((n, i) => (i === idx ? trimmed : n))
  });
}

function cyclePersonState(billId, idx) {
  pushState({
    ...state,
    bills: state.bills.map((b) => {
      if (b.id !== billId) return b;
      const participants = getParticipants(b).slice();
      const personPaid = b.personPaid.slice();
      const custom = getCustom(b).slice();
      if (!participants[idx]) {
        // not part of this bill -> include, unpaid
        participants[idx] = true;
        personPaid[idx] = false;
      } else if (!personPaid[idx]) {
        // included, unpaid -> included, paid
        personPaid[idx] = true;
      } else {
        // included, paid -> exclude from this bill (drop any custom amount)
        participants[idx] = false;
        personPaid[idx] = false;
        custom[idx] = null;
      }
      // normalize away legacy fields so the bill uses the new model
      const next = { ...b, participants, personPaid, custom };
      delete next.splitMode;
      delete next.shares;
      return next;
    })
  });
}

function toggleVendorPaid(billId) {
  pushState({
    ...state,
    bills: state.bills.map((b) => (b.id === billId ? { ...b, vendorPaid: !b.vendorPaid } : b))
  });
}

function deleteBill(billId) {
  pushState({ ...state, bills: state.bills.filter((b) => b.id !== billId) });
}

/* Save whichever draft is open (add when billId is null, otherwise edit). */
function commitDraft() {
  const d = ui.draft;
  if (!d) return;
  const total = parseFloat(d.total);
  if (!d.name.trim() || isNaN(total) || total < 0) {
    ui.formError = "Enter a bill name and a valid amount.";
    render();
    return;
  }
  const res = draftToShares(d);
  if (!d.include.some(Boolean)) {
    ui.formError = "Pick at least one person for this bill.";
    render();
    return;
  }
  if (res.over) {
    ui.formError = "Custom amounts add up to more than the bill total.";
    render();
    return;
  }
  if (res.mismatch) {
    ui.formError = "Custom amounts must add up to the total, or leave someone to split the rest.";
    render();
    return;
  }
  ui.formError = "";

  const custom = d.include.map((inc, i) => {
    if (!inc || d.mode !== "custom") return null;
    const raw = d.amounts[i];
    const v = parseFloat(raw);
    return raw !== "" && raw != null && !isNaN(v) ? v : null;
  });
  const participants = d.include.slice();

  if (d.billId == null) {
    pushState({
      ...state,
      bills: [
        ...state.bills,
        {
          id: genId(),
          date: d.date,
          name: d.name.trim(),
          total,
          vendorPaid: false,
          participants,
          personPaid: state.people.map(() => false),
          custom
        }
      ]
    });
  } else {
    pushState({
      ...state,
      bills: state.bills.map((b) => {
        if (b.id !== d.billId) return b;
        const prevPaid = b.personPaid || [];
        const personPaid = participants.map((inc, i) => (inc ? !!prevPaid[i] : false));
        // normalize away legacy fields so the bill uses the new model
        const next = { ...b, date: d.date, name: d.name.trim() || b.name, total, participants, personPaid, custom };
        delete next.splitMode;
        delete next.shares;
        return next;
      })
    });
  }
  ui.draft = null;
}

/* ---------- rendering ---------- */

function render() {
  const root = document.getElementById("app");
  if (!state) return;
  const { totalDue, dueToReceive } = computeTotals();

  root.innerHTML = `
    <div class="bl-header">
      <div class="bl-container">
        <h1 class="bl-serif">Bill Ledger</h1>
        <div class="bl-people-row">
          <span>Split between</span>
          ${state.people.map((p, i) => renderPersonChip(p, i)).join('<span style="opacity:0.5">·</span>')}
          <button class="bl-tiny-icon-btn" data-action="add-person" title="Add person">+</button>
          ${state.people.length > 1 ? '<button class="bl-tiny-icon-btn" data-action="remove-person" title="Remove last person">&times;</button>' : ""}
        </div>
      </div>
    </div>

    <div class="bl-summary">
      <div class="bl-container bl-summary-row">
        <div class="bl-summary-cell bordered">
          <div class="bl-summary-label">Total Due</div>
          <div class="bl-serif bl-summary-value" style="color:${totalDue > 0 ? "var(--rust)" : "var(--ink)"}">${fmt(totalDue)}</div>
        </div>
        <div class="bl-summary-cell">
          <div class="bl-summary-label">Due to Receive</div>
          <div class="bl-serif bl-summary-value" style="color:${dueToReceive > 0 ? "var(--brass)" : "var(--ink)"}">${fmt(dueToReceive)}</div>
        </div>
      </div>
    </div>

    <div class="bl-container" style="padding-top:8px; padding-bottom:8px;">
      ${state.bills.length === 0 ? '<div class="bl-empty">No bills yet — add your first one below.</div>' : state.bills.map((b, idx) => renderBillRow(b, idx)).join("")}
    </div>

    <div class="bl-container" style="padding-bottom:16px; padding-top:8px;">
      ${ui.draft && ui.draft.billId == null ? renderAddForm() : '<button class="bl-add-toggle" data-action="show-add-form">+ Add a bill</button>'}
    </div>

    <div class="bl-status ${ui.usingFallback ? "warn" : ""}">
      ${ui.usingFallback ? "Not connected to a shared ledger — saving to this device only. Add your Firebase config in the file to sync across phones." : "Synced live across everyone with this link."}
    </div>
  `;

  attachHandlers();
}

function renderPersonChip(p, i) {
  if (ui.editingPersonIdx === i) {
    return `<span><input class="bl-person-input" id="person-input-${i}" value="${escapeAttr(p)}" data-idx="${i}" /></span>`;
  }
  return `<span><button class="bl-person-btn" data-action="start-rename-person" data-idx="${i}">${escapeHtml(p)}</button></span>`;
}

function renderBillRow(b, idx) {
  if (ui.draft && ui.draft.billId === b.id) {
    return renderEditRow(b, idx);
  }
  const { amounts, per, splitCount, customCount, over, mismatch } = computeShares(b);
  const participants = getParticipants(b);
  const custom = getCustom(b);
  const participantCount = participants.filter(Boolean).length;

  let shareText;
  if (splitCount > 0) {
    shareText = `${fmt(per)} / split`;
    if (customCount > 0) shareText += ` · ${customCount} custom`;
  } else {
    shareText = "all custom";
  }
  if (participantCount !== state.people.length) {
    shareText += ` · ${participantCount} of ${state.people.length}`;
  }
  const warn = over || mismatch;
  if (over) shareText = "custom amounts exceed total";
  else if (mismatch) shareText = "custom amounts don't match total";

  return `
    <div class="bl-row">
      <div class="bl-row-inner">
        <div class="bl-idx">${String(idx + 1).padStart(3, "0")}</div>
        <div class="bl-bill-main">
          <div class="bl-bill-title-row">
            <span class="bl-serif bl-bill-name">${escapeHtml(b.name)}</span>
            <span class="bl-bill-date">${fmtDate(b.date)}</span>
            <button class="bl-icon-ghost" data-action="start-edit" data-bill-id="${b.id}" title="Edit bill & split">✎</button>
          </div>
          <div class="bl-chips">
            ${state.people
              .map((p, i) => {
                const included = participants[i];
                const paid = b.personPaid[i];
                const isCustom = included && typeof custom[i] === "number";
                const cls = !included ? "excluded" : paid ? "paid" : "unpaid";
                const label = !included ? "− " : paid ? "✓ " : "";
                const amtText = included ? `<span class="bl-chip-amt"> · ${fmt(amounts[i])}${isCustom ? '<span class="bl-chip-star">*</span>' : ""}</span>` : "";
                const title = !included
                  ? `${p} is not part of this bill — click to include`
                  : `${p} owes ${fmt(amounts[i])}${isCustom ? " (set amount)" : " (even split)"} and has ${paid ? "paid" : "not paid"} — click to ${paid ? "leave out of this bill" : "mark paid"}`;
                return `
              <button class="bl-chip ${cls}" data-action="toggle-person" data-bill-id="${b.id}" data-person-idx="${i}" title="${escapeAttr(title)}">
                ${label}${escapeHtml(p)}${amtText}
              </button>`;
              })
              .join("")}
          </div>
        </div>
        <div class="bl-amount-col">
          <div class="bl-serif bl-amount">${fmt(b.total)}</div>
          <div class="bl-share${warn ? " warn" : ""}">${shareText}</div>
          <button class="bl-stamp-btn ${b.vendorPaid ? "paid" : "unpaid"}" data-action="toggle-vendor" data-bill-id="${b.id}">${b.vendorPaid ? "PAID" : "UNPAID"}</button>
          <button class="bl-delete-btn" data-action="delete-bill" data-bill-id="${b.id}" title="Delete bill">🗑</button>
        </div>
      </div>
    </div>
  `;
}

function renderEditRow(b, idx) {
  const d = ui.draft;
  return `
    <div class="bl-row">
      <div class="bl-row-inner">
        <div class="bl-idx">${String(idx + 1).padStart(3, "0")}</div>
        <div class="bl-bill-main">
          <form id="draft-form">
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <input type="date" class="bl-input" id="draft-date" value="${escapeAttr(d.date)}" />
              <input type="text" class="bl-input" id="draft-name" value="${escapeAttr(d.name)}" style="flex:1; min-width:120px;" placeholder="Bill name" />
              <input type="number" step="0.01" class="bl-input" id="draft-total" value="${escapeAttr(d.total)}" style="width:90px;" placeholder="0.00" />
            </div>
            ${renderSplitEditor(d)}
            ${ui.formError ? `<div class="bl-form-error">${escapeHtml(ui.formError)}</div>` : ""}
            <div style="display:flex; gap:8px; margin-top:12px;">
              <button type="submit" class="bl-primary-btn">Save</button>
              <button type="button" class="bl-ghost-btn" data-action="cancel-draft">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;
}

function renderSplitEditor(d) {
  const res = draftToShares(d);
  return `
    <div class="bl-split-editor">
      <div class="bl-mode-toggle">
        <button type="button" class="bl-mode-btn ${d.mode === "auto" ? "active" : ""}" data-action="draft-mode" data-mode="auto">Even split</button>
        <button type="button" class="bl-mode-btn ${d.mode === "custom" ? "active" : ""}" data-action="draft-mode" data-mode="custom">Custom amounts</button>
      </div>
      <div class="bl-editor-hint">
        ${d.mode === "auto"
          ? "Everyone ticked splits the bill evenly."
          : "Type an amount for anyone paying a set share. Leave it blank to split whatever's left evenly."}
      </div>
      ${state.people
        .map((p, i) => {
          const inc = d.include[i];
          const amtInput =
            d.mode === "custom"
              ? `<input type="number" step="0.01" min="0" class="bl-input bl-amt-input" id="amt-${i}" data-idx="${i}" value="${escapeAttr(d.amounts[i] || "")}" placeholder="split" ${inc ? "" : "disabled"} />`
              : "";
          return `
        <div class="bl-person-line">
          <label><input type="checkbox" data-action="draft-include" data-idx="${i}" ${inc ? "checked" : ""} /> <span class="bl-person-name">${escapeHtml(p)}</span></label>
          ${amtInput}
          <span class="bl-person-owe" id="owe-${i}">${inc ? fmt(res.amounts[i]) : "—"}</span>
        </div>`;
        })
        .join("")}
      <div class="bl-preview${res.over || res.mismatch ? " warn" : ""}" id="editor-preview">${escapeHtml(editorPreviewText(res))}</div>
    </div>
  `;
}

function editorPreviewText(res) {
  if (res.over) return "Custom amounts exceed the bill total by " + fmt(-res.remainder) + ".";
  if (res.mismatch)
    return "Custom amounts total " + fmt(res.customSum) + " of " + fmt(res.total) + " — assign the rest or let someone split it.";
  if (res.splitCount > 0) {
    return res.customSum > 0
      ? "Even split: " + fmt(res.per) + " each for " + res.splitCount + " · custom total " + fmt(res.customSum)
      : "Even split: " + fmt(res.per) + " each for " + res.splitCount + ".";
  }
  return "All set by hand — totals " + fmt(res.customSum) + ".";
}

function renderAddForm() {
  const d = ui.draft;
  return `
    <form class="bl-add-form" id="draft-form">
      <div class="bl-add-form-row">
        <input type="date" class="bl-input" id="draft-date" value="${escapeAttr(d.date)}" />
        <input type="text" class="bl-input" id="draft-name" placeholder="Bill name" style="flex:1; min-width:140px;" value="${escapeAttr(d.name)}" />
        <input type="number" step="0.01" min="0" class="bl-input" id="draft-total" placeholder="0.00" style="width:100px;" value="${escapeAttr(d.total)}" />
      </div>
      ${renderSplitEditor(d)}
      ${ui.formError ? `<div class="bl-form-error">${escapeHtml(ui.formError)}</div>` : ""}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button type="submit" class="bl-primary-btn">Add bill</button>
        <button type="button" class="bl-ghost-btn" data-action="cancel-draft">Cancel</button>
      </div>
    </form>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* Live-update the owed amounts and preview text without a full
   re-render, so text inputs keep focus while typing. */
function refreshEditor() {
  const d = ui.draft;
  if (!d) return;
  const res = draftToShares(d);
  d.include.forEach((inc, i) => {
    const span = document.getElementById("owe-" + i);
    if (span) span.textContent = inc ? fmt(res.amounts[i]) : "—";
  });
  const prev = document.getElementById("editor-preview");
  if (prev) {
    prev.className = "bl-preview" + (res.over || res.mismatch ? " warn" : "");
    prev.textContent = editorPreviewText(res);
  }
}

/* ---------- event wiring ---------- */

function attachHandlers() {
  const root = document.getElementById("app");

  root.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", (e) => {
      const action = el.getAttribute("data-action");
      const billId = el.getAttribute("data-bill-id");
      const idx = el.getAttribute("data-idx");
      const personIdx = el.getAttribute("data-person-idx");

      if (action === "add-person") addPerson();
      else if (action === "remove-person") removePerson();
      else if (action === "start-rename-person") {
        ui.editingPersonIdx = Number(idx);
        render();
        const input = document.getElementById("person-input-" + idx);
        if (input) {
          input.focus();
          input.select();
        }
      } else if (action === "toggle-person") cyclePersonState(billId, Number(personIdx));
      else if (action === "toggle-vendor") toggleVendorPaid(billId);
      else if (action === "delete-bill") {
        if (confirm("Delete this bill?")) deleteBill(billId);
      } else if (action === "start-edit") {
        const bill = state.bills.find((b) => b.id === billId);
        if (bill) {
          ui.draft = billToDraft(bill);
          ui.formError = "";
          render();
        }
      } else if (action === "show-add-form") {
        ui.draft = newAddDraft();
        ui.formError = "";
        render();
      } else if (action === "cancel-draft") {
        ui.draft = null;
        ui.formError = "";
        render();
      } else if (action === "draft-mode") {
        if (ui.draft) {
          ui.draft.mode = el.getAttribute("data-mode");
          render();
        }
      } else if (action === "draft-include") {
        if (ui.draft) {
          ui.draft.include[Number(idx)] = el.checked;
          render();
        }
      }
    });
  });

  state.people.forEach((p, i) => {
    if (ui.editingPersonIdx === i) {
      const input = document.getElementById("person-input-" + i);
      if (!input) return;
      const commit = () => {
        renamePerson(i, input.value);
        ui.editingPersonIdx = null;
      };
      input.addEventListener("blur", commit);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          commit();
        }
        if (e.key === "Escape") {
          ui.editingPersonIdx = null;
          render();
        }
      });
    }
  });

  const draftForm = document.getElementById("draft-form");
  if (draftForm && ui.draft) {
    const d = ui.draft;
    const dDate = document.getElementById("draft-date");
    if (dDate) dDate.addEventListener("input", (e) => (d.date = e.target.value));
    const dName = document.getElementById("draft-name");
    if (dName) dName.addEventListener("input", (e) => (d.name = e.target.value));
    const dTotal = document.getElementById("draft-total");
    if (dTotal)
      dTotal.addEventListener("input", (e) => {
        d.total = e.target.value;
        refreshEditor();
      });
    d.include.forEach((_, i) => {
      const amt = document.getElementById("amt-" + i);
      if (amt)
        amt.addEventListener("input", (e) => {
          d.amounts[i] = e.target.value;
          refreshEditor();
        });
    });
    draftForm.addEventListener("submit", (e) => {
      e.preventDefault();
      commitDraft();
    });
  }
}

initFirebase();
</script>
</body>
</html>
